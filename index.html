    function renderHome() {
      const cur = me();
      const stories = getActiveStories();
      const myStories = stories.filter(s => s.authorId === cur.uid);
      const otherAuthorIds = [...new Set(stories.filter(s => s.authorId !== cur.uid).map(s => s.authorId))];

      const storyBarHtml = `
        <div class="card">
          <div class="stories-row">
            <div class="story-item">
              <div class="story-ring ${myStories.length ? '' : 'empty'}" onclick="${myStories.length ? `openStoryViewer('${cur.uid}')` : `openUploadModal('story')`}" style="cursor:pointer;">
                <img src="${uPhoto(cur)}" />
                <button onclick="event.stopPropagation();openUploadModal('story')" class="story-plus">+</button>
              </div>
              <div style="font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">आपकी स्टोरी</div>
            </div>
            ${otherAuthorIds.map(aid => {
              const u = getUser(aid);
              const uStories = stories.filter(s => s.authorId === aid);
              const allSeen = uStories.every(s => s.views.some(v => v.uid === cur.uid));
              return `
                <div class="story-item" onclick="openStoryViewer('${aid}')" style="cursor:pointer;">
                  <div class="story-ring ${allSeen ? 'seen' : ''}">
                    <img src="${uPhoto(u)}" />
                  </div>
                  <div style="font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(u.name.split(' ')[0])}</div>
                </div>`;
            }).join('')}
          </div>
        </div>`;

      const feedPosts = DB.posts.filter(p => canViewAuthor(getUser(p.authorId)));
      const postsHtml = feedPosts.length
        ? feedPosts.map(renderPostCard).join('')
        : `<div class="card card-pad" style="text-align:center;"><p>अभी कोई पोस्ट नहीं है।</p><button onclick="openUploadModal('post')" class="btn btn-primary" style="width:auto;">पहली पोस्ट बनाएँ</button></div>`;

      return storyBarHtml + postsHtml;
    }

    function renderSearchResultsHtml() {
      const q = UI.searchQuery.trim().toLowerCase();
      if (UI.searchTab === 'explore') {
        const list = DB.posts
          .filter(p => canViewAuthor(getUser(p.authorId)))
          .filter(p => !q || p.caption.toLowerCase().includes(q) || getUser(p.authorId)?.name.toLowerCase().includes(q))
          .sort((a, b) => b.likes.length - a.likes.length);
        return list.length
          ? `<div class="card"><div class="grid-3">${list.map(p => {
              const s = resolveMediaSrc(p.mediaUrl);
              return `<div class="grid-cell" onclick="openPostDetailModal('${p.id}')" style="cursor:pointer;">${p.mediaType === 'video' ? `<video src="${s}"></video>` : `<img src="${s}" />`}</div>`;
            }).join('')}</div></div>`
          : `<div class="card card-pad" style="text-align:center;color:#64748b;">कोई पोस्ट नहीं मिली।</div>`;
      } else {
        const users = DB.users.filter(u => !q || u.name.toLowerCase().includes(q) || u.username.toLowerCase().includes(q));
        return `<div class="card">${users.map(u => `
          <div onclick="go('profile','${u.uid}')" class="between" style="padding:12px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer;">
            <div class="row">
              <img src="${uPhoto(u)}" class="avatar" style="width:44px;height:44px;" />
              <div><div style="font-size:14px;font-weight:700;">${esc(u.name)}</div><div style="font-size:12px;color:#64748b;">@${esc(u.username)}</div></div>
            </div>
            <span style="font-size:12px;font-weight:700;color:#FF5A36;">प्रोफाइल देखें</span>
          </div>`).join('') || '<div class="card-pad" style="text-align:center;">कोई व्यक्ति नहीं मिला।</div>'}</div>`;
      }
    }

    function renderSearch() {
      return `
        <input class="input" style="margin-bottom:10px;" value="${esc(UI.searchQuery)}" oninput="filterSearch(this.value)" placeholder="🔍 लोगों, फोटो या वीडियो को खोजें..." />
        <div class="tabs">
          <button onclick="UI.searchTab='explore';render();" class="tab-btn ${UI.searchTab === 'explore' ? 'active' : ''}">🔥 लोकप्रिय पोस्ट</button>
          <button onclick="UI.searchTab='users';render();" class="tab-btn ${UI.searchTab === 'users' ? 'active' : ''}">👥 लोग खोजें</button>
        </div>
        <div id="search-results-box">${renderSearchResultsHtml()}</div>`;
    }

    function renderReels() {
      const cur = me();
      const reels = DB.reels.filter(r => canViewAuthor(getUser(r.authorId)));
      return `
        <div class="reels-wrap">
          <div class="between" style="position:fixed;top:0;left:0;right:0;z-index:30;padding:12px 16px;background:linear-gradient(to bottom,rgba(0,0,0,0.7),transparent);color:#fff;max-width:560px;margin:0 auto;">
            <span style="font-weight:900;font-size:18px;">YAARI रील्स</span>
            <button onclick="openUploadModal('reel')" class="btn" style="background:var(--grad);color:#fff;padding:7px 14px;font-size:12px;">+ रील बनाएँ</button>
          </div>
          ${reels.length === 0 ? `
            <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:10px;">
              <p>अभी कोई रील नहीं है</p>
              <button onclick="openUploadModal('reel')" class="btn btn-primary" style="width:auto;">पहली रील अपलोड करें</button>
            </div>
          ` : reels.map(r => {
            const author = getUser(r.authorId);
            const liked = r.likes.includes(cur.uid);
            const mSrc = resolveMediaSrc(r.mediaUrl);
            return `
              <div class="reel-slide">
                ${r.isDemoArt
                  ? `<img src="${mSrc}" style="width:100%;height:100%;object-fit:contain;" />`
                  : `<video id="reel-vid-${r.id}" src="${mSrc}" class="reel-video" autoplay loop playsinline ${UI.reelsMuted ? 'muted' : ''} onclick="toggleReelPlay('${r.id}')"></video>`}
                <div id="reel-play-badge-${r.id}" class="hidden" style="position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,0.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;pointer-events:none;">▶</div>
                <div class="reel-actions">
                  <button onclick="toggleLikeReel('${r.id}')" class="reel-act-btn"><div class="reel-act-circle">${liked ? '❤️' : '🤍'}</div><span>${r.likes.length}</span></button>
                  <button onclick="openCommentsModal('reel','${r.id}')" class="reel-act-btn"><div class="reel-act-circle">💬</div><span>${r.comments.length}</span></button>
                  <button onclick="shareContent('YAARI रील','${esc(author.name)} की रील देखें')" class="reel-act-btn"><div class="reel-act-circle">📤</div><span>शेयर</span></button>
                  <button onclick="toggleReelMute()" class="reel-act-btn"><div class="reel-act-circle">${UI.reelsMuted ? '🔇' : '🔊'}</div><span>${UI.reelsMuted ? 'म्यूट' : 'आवाज़'}</span></button>
                  ${author.uid === cur.uid
                    ? `<button onclick="deleteReel('${r.id}')" class="reel-act-btn"><div class="reel-act-circle">🗑️</div></button>`
                    : `<button onclick="reportContent('reel','${r.id}','${author.uid}')" class="reel-act-btn"><div class="reel-act-circle">🚩</div></button>`}
                </div>
                <div style="position:absolute;left:14px;right:76px;bottom:24px;color:#fff;text-shadow:0 1px 4px #000;">
                  <div class="row" onclick="go('profile','${author.uid}')" style="cursor:pointer;margin-bottom:6px;">
                    <img src="${uPhoto(author)}" class="avatar" style="width:38px;height:38px;border-color:#fff;" />
                    <div><b>${esc(author.name)}</b><div style="font-size:11px;opacity:0.85;">@${esc(author.username)}</div></div>
                  </div>
                  ${r.caption ? `<p style="margin:0;font-size:13px;">${esc(r.caption)}</p>` : ''}
                </div>
              </div>`;
          }).join('')}
        </div>`;
    }

    function renderNotifications() {
      const cur = me();
      const myNotifs = DB.notifications.filter(n => n.toUid === cur.uid);
      return `
        <div class="between" style="margin-bottom:12px;">
          <h2 style="margin:0;font-size:18px;">नोटिफिकेशन</h2>
          ${myNotifs.some(n => !n.isRead) ? `<button onclick="markAllNotifsRead()" style="color:#FF5A36;font-size:12px;font-weight:700;">✓ सभी पढ़ा हुआ चिह्नित करें</button>` : ''}
        </div>
        ${cur.friendRequests.length ? `
          <div class="card card-pad">
            <h4 style="margin:0 0 10px;font-size:14px;">फ्रेंड रिक्वेस्ट (${cur.friendRequests.length})</h4>
            ${cur.friendRequests.map(fid => {
              const u = getUser(fid); if (!u) return '';
              return `<div class="between" style="margin-bottom:8px;">
                <div class="row" onclick="go('profile','${u.uid}')" style="cursor:pointer;">
                  <img src="${uPhoto(u)}" class="avatar" style="width:40px;height:40px;" />
                  <div><b>${esc(u.name)}</b><div style="font-size:11px;color:#64748b;">@${esc(u.username)}</div></div>
                </div>
                <div class="row"><button onclick="acceptFriendReq('${u.uid}')" class="btn" style="background:#10b981;color:#fff;padding:6px 10px;">स्वीकार</button><button onclick="rejectFriendReq('${u.uid}')" class="btn btn-soft" style="padding:6px 10px;">✕</button></div>
              </div>`;
            }).join('')}
          </div>` : ''}
        <div class="card">
          ${myNotifs.length === 0 ? `<div class="card-pad" style="text-align:center;color:#64748b;">अभी कोई नोटिफिकेशन नहीं है।</div>` : myNotifs.map(n => {
            const s = getUser(n.senderId);
            return `<div onclick="n_click('${n.id}','${n.type}','${n.senderId}')" class="between" style="padding:12px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer;background:${n.isRead ? '#fff' : '#fff7ed'};">
              <div class="row">
                <img src="${uPhoto(s)}" class="avatar" style="width:40px;height:40px;" />
                <div style="font-size:13px;"><b>${esc(s?.name || 'यूज़र')}</b> ${esc(n.text)}<div style="font-size:11px;color:#94a3b8;">${timeAgo(n.createdAt)}</div></div>
              </div>
              ${!n.isRead ? `<span style="width:9px;height:9px;border-radius:50%;background:#FF5A36;"></span>` : ''}
            </div>`;
          }).join('')}
        </div>`;
    }

    function n_click(nid, type, sid) {
      const n = DB.notifications.find(x => x.id === nid);
      if (n) { n.isRead = true; saveDB(); }
      if (type === 'message') openChatWith(sid); else go('profile', sid);
    }

    function renderChat() {
      const cur = me();
      if (UI.activeChatId) {
        const chat = DB.chats.find(c => c.id === UI.activeChatId);
        const partnerId = chat.participants.find(id => id !== cur.uid);
        const partner = getUser(partnerId);
        let changed = false;
        chat.messages.forEach(m => { if (m.senderId !== cur.uid && !m.isRead) { m.isRead = true; changed = true; } });
        if (changed) saveDB();
        const blocked = cur.blocked.includes(partnerId) || partner.blocked.includes(cur.uid);

        return `
          <div class="chat-box">
            <div class="between" style="padding:10px 14px;border-bottom:1px solid var(--border);">
              <div class="row">
                <button onclick="UI.activeChatId=null;render();" style="font-size:20px;padding:4px;">←</button>
                <div class="row" onclick="go('profile','${partner.uid}')" style="cursor:pointer;">
                  <img src="${uPhoto(partner)}" class="avatar" style="width:38px;height:38px;" />
                  <div>
                    <div style="font-size:14px;font-weight:700;">${esc(partner.name)}</div>
                    <div style="font-size:11px;color:#64748b;">${partner.isOnline ? '<span class="online-dot"></span> ऑनलाइन' : `अंतिम बार: ${timeAgo(partner.lastSeen)}`}</div>
                  </div>
                </div>
              </div>
              <div class="row">
                <button onclick="startCall('${partner.uid}','audio')" class="icon-btn" title="ऑडियो कॉल">📞</button>
                <button onclick="startCall('${partner.uid}','video')" class="icon-btn" title="वीडियो कॉल">📹</button>
              </div>
            </div>

            <div id="chat-msgs" class="chat-messages">
              ${chat.messages.map(m => {
                const mine = m.senderId === cur.uid;
                const ms = resolveMediaSrc(m.mediaUrl);
                return `<div class="bubble ${mine ? 'me' : 'them'}">
                  ${m.mediaUrl ? (m.mediaType === 'video' ? `<video src="${ms}" controls style="max-width:220px;border-radius:10px;"></video>` : `<img src="${ms}" style="max-width:220px;border-radius:10px;" />`) : ''}
                  ${m.text ? `<div>${esc(m.text)}</div>` : ''}
                  <div style="font-size:10px;opacity:0.8;text-align:right;margin-top:2px;">
                    ${timeAgo(m.createdAt)} ${mine ? (m.isRead ? '<span style="color:#bae6fd;">✓✓</span>' : '✓') : ''}
                  </div>
                </div>`;
              }).join('') || '<p style="text-align:center;color:#94a3b8;font-size:12px;">नमस्ते कहकर बातचीत शुरू करें!</p>'}
            </div>

            ${blocked ? `<div style="padding:12px;text-align:center;background:#f1f5f9;font-size:12px;">इस बातचीत में संदेश नहीं भेजे जा सकते।</div>` : `
              <form onsubmit="sendChatText(event)" class="row" style="padding:10px;border-top:1px solid var(--border);background:#fff;">
                <label class="icon-btn" title="फोटो/वीडियो भेजें">🖼️
                  <input type="file" accept="image/*,video/*" class="hidden" onchange="sendChatMedia(this)" />
                </label>
                <input name="msg" class="input" placeholder="संदेश लिखें..." autocomplete="off" />
                <button type="submit" class="btn btn-primary" style="width:auto;">भेजें</button>
              </form>`}
          </div>`;
      }

      const myChats = DB.chats.filter(c => c.participants.includes(cur.uid));
      const others = DB.users.filter(u => u.uid !== cur.uid);
      return `
        <div class="between" style="margin-bottom:12px;">
          <h2 style="margin:0;font-size:18px;">निजी चैट</h2>
        </div>
        <div class="card">
          ${myChats.map(c => {
            const pid = c.participants.find(id => id !== cur.uid);
            const p = getUser(pid); if (!p) return '';
            const last = c.messages[c.messages.length - 1];
            const unread = c.messages.filter(m => m.senderId !== cur.uid && !m.isRead).length;
            return `<div onclick="UI.activeChatId='${c.id}';render();" class="between" style="padding:12px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer;">
              <div class="row">
                <img src="${uPhoto(p)}" class="avatar" style="width:46px;height:46px;" />
                <div>
                  <div style="font-size:14px;font-weight:700;">${esc(p.name)} ${p.isOnline ? '<span class="online-dot"></span>' : ''}</div>
                  <div style="font-size:12px;color:#64748b;">${last ? (last.text ? esc(last.text.slice(0, 32)) : '📷 मीडिया') : 'बातचीत शुरू करें'}</div>
                </div>
              </div>
              ${unread ? `<span class="badge" style="position:static;">${unread}</span>` : ''}
            </div>`;
          }).join('')}
        </div>
        <div class="card card-pad">
          <div style="font-size:13px;font-weight:700;margin-bottom:8px;">नए व्यक्ति से चैट शुरू करें</div>
          ${others.map(u => `
            <div onclick="openChatWith('${u.uid}')" class="between" style="padding:8px 0;border-bottom:1px solid #f1f5f9;cursor:pointer;">
              <div class="row"><img src="${uPhoto(u)}" class="avatar" style="width:36px;height:36px;" /><span><b>${esc(u.name)}</b> (@${esc(u.username)})</span></div>
              <span style="color:#FF5A36;font-size:12px;font-weight:700;">चैट करें</span>
            </div>`).join('')}
        </div>`;
    }

    function renderLive() {
      const cur = me();
      if (UI.activeLiveId) {
        const live = DB.lives.find(l => l.id === UI.activeLiveId);
        if (!live) { UI.activeLiveId = null; return renderLive(); }
        const host = getUser(live.hostId);
        return `
          <div style="position:fixed;inset:0;z-index:55;background:#000;color:#fff;display:flex;flex-direction:column;justify-content:space-between;">
            <video id="live-cam-vid" autoplay muted playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;"></video>
            <div class="between" style="position:relative;z-index:2;padding:14px;background:linear-gradient(to bottom,rgba(0,0,0,0.75),transparent);">
              <div class="row">
                <img src="${uPhoto(host)}" class="avatar" style="width:38px;height:38px;border-color:#E11D48;" />
                <div><b>${esc(host.name)}</b><div style="font-size:11px;">${esc(live.title)}</div></div>
              </div>
              <div class="row">
                <span style="background:#E11D48;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800;">लाइव</span>
                <span style="background:rgba(0,0,0,0.55);padding:4px 10px;border-radius:99px;font-size:11px;">👁️ ${live.viewersCount}</span>
                <button onclick="stopOrLeaveLive()" class="btn" style="background:#dc2626;color:#fff;padding:6px 12px;font-size:12px;">${live.hostId === cur.uid ? 'लाइव समाप्त' : 'बाहर निकलें'}</button>
              </div>
            </div>
            <div style="position:relative;z-index:2;padding:14px;background:linear-gradient(to top,rgba(0,0,0,0.85),transparent);">
              <div style="max-height:180px;overflow-y:auto;margin-bottom:10px;display:flex;flex-direction:column;gap:6px;">
                ${live.comments.map(c => `<div style="background:rgba(0,0,0,0.5);padding:6px 10px;border-radius:12px;font-size:12px;width:fit-content;"><b style="color:#fdba74;">${esc(getUser(c.authorId)?.name)}:</b> ${esc(c.text)}</div>`).join('')}
              </div>
              <form onsubmit="sendLiveComment(event)" class="row">
                <input name="msg" class="input" style="background:rgba(255,255,255,0.18);color:#fff;border-color:rgba(255,255,255,0.25);" placeholder="लाइव कमेंट लिखें..." required />
                <button type="submit" class="btn btn-primary" style="width:auto;">भेजें</button>
              </form>
            </div>
          </div>`;
      }

      return `
        <form onsubmit="startLive(event)" class="card card-pad" style="background:var(--grad);color:#fff;">
          <h2 style="margin:0 0 6px;font-size:18px;">📡 लाइव वीडियो शुरू करें</h2>
          <p style="margin:0 0 12px;font-size:12px;opacity:0.9;">अपने दोस्तों के साथ लाइव जुड़ें और लाइव कमेंट प्राप्त करें।</p>
          <div class="row">
            <input name="title" class="input" placeholder="लाइव वीडियो का शीर्षक लिखें..." />
            <button type="submit" class="btn btn-dark" style="white-space:nowrap;">लाइव जाएँ</button>
          </div>
        </form>
        <h3 style="font-size:14px;margin:12px 4px;">चल रहे लाइव (${DB.lives.length})</h3>
        <div class="card">
          ${DB.lives.length === 0 ? `<div class="card-pad" style="text-align:center;color:#64748b;">अभी कोई लाइव प्रसारण नहीं चल रहा है।</div>` : DB.lives.map(l => {
            const h = getUser(l.hostId);
            return `<div onclick="UI.activeLiveId='${l.id}';l_join('${l.id}')" class="between" style="padding:12px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer;">
              <div class="row"><img src="${uPhoto(h)}" class="avatar" style="width:44px;height:44px;border-color:#E11D48;" /><div><b>${esc(h.name)}</b><div style="font-size:12px;color:#64748b;">${esc(l.title)}</div></div></div>
              <span style="background:#E11D48;color:#fff;padding:5px 12px;border-radius:99px;font-size:11px;font-weight:800;">देखें</span>
            </div>`;
          }).join('')}
        </div>`;
    }

    function l_join(lid) {
      const l = DB.lives.find(x => x.id === lid);
      if (l) { l.viewersCount++; saveDB(); }
      UI.activeLiveId = lid; render();
    }

    function renderAdmin() {
      const pending = DB.reports.filter(r => r.status === 'pending').length;
      return `
        <div class="card card-pad" style="background:#0f172a;color:#fff;">
          <h2 style="margin:0 0 12px;font-size:18px;">🛡️ YAARI एडमिन पैनल</h2>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;">
            <div style="background:rgba(255,255,255,0.1);padding:12px;border-radius:14px;"><div style="font-size:22px;font-weight:900;">${DB.users.length}</div><div style="font-size:11px;">कुल यूज़र</div></div>
            <div style="background:rgba(255,255,255,0.1);padding:12px;border-radius:14px;"><div style="font-size:22px;font-weight:900;color:#fcd34d;">${pending}</div><div style="font-size:11px;">लंबित शिकायतें</div></div>
          </div>
        </div>
        <div class="tabs">
          <button onclick="UI.adminTab='users';render();" class="tab-btn ${UI.adminTab === 'users' ? 'active' : ''}">यूज़र प्रबंधन</button>
          <button onclick="UI.adminTab='reports';render();" class="tab-btn ${UI.adminTab === 'reports' ? 'active' : ''}">रिपोर्ट्स (${DB.reports.length})</button>
        </div>
        <div class="card">
          ${UI.adminTab === 'users' ? DB.users.map(u => `
            <div class="between" style="padding:12px 14px;border-bottom:1px solid #f1f5f9;">
              <div class="row" onclick="go('profile','${u.uid}')" style="cursor:pointer;">
                <img src="${uPhoto(u)}" class="avatar" style="width:40px;height:40px;" />
                <div><b>${esc(u.name)}</b><div style="font-size:11px;color:#64748b;">@${esc(u.username)} • ${u.isBanned ? 'प्रतिबंधित' : 'सक्रिय'}</div></div>
              </div>
              ${u.uid !== me().uid ? `<button onclick="adminToggleBan('${u.uid}')" class="btn ${u.isBanned ? 'btn-soft' : 'btn-danger'}" style="padding:6px 10px;font-size:11px;">${u.isBanned ? 'चालू करें' : 'प्रतिबंधित करें'}</button>` : ''}
            </div>`).join('')
          : (DB.reports.length === 0 ? `<div class="card-pad" style="text-align:center;color:#64748b;">कोई शिकायत नहीं है।</div>` : DB.reports.map(r => `
            <div style="padding:14px;border-bottom:1px solid #f1f5f9;">
              <div class="between"><b>${r.kind === 'reel' ? 'रील रिपोर्ट' : 'पोस्ट रिपोर्ट'}</b><span style="font-size:11px;font-weight:700;">${r.status === 'pending' ? 'लंबित' : r.status === 'resolved' ? 'हटाया गया' : 'खारिज'}</span></div>
              <p style="margin:6px 0;font-size:13px;">कारण: ${esc(r.reason)}</p>
              ${r.status === 'pending' ? `<div class="row"><button onclick="adminHandleReport('${r.id}','delete')" class="btn btn-danger" style="flex:1;padding:8px;">सामग्री हटाएँ</button><button onclick="adminHandleReport('${r.id}','dismiss')" class="btn btn-soft" style="padding:8px;">अनदेखा करें</button></div>` : ''}
            </div>`).join(''))}
        </div>`;
    }

    function renderProfile() {
      const cur = me();
      const target = getUser(UI.profileUid || cur.uid) || cur;
      const isMine = target.uid === cur.uid;
      const myPosts = DB.posts.filter(p => p.authorId === target.uid);
      const canSee = canViewAuthor(target);
      const isFol = target.followers.includes(cur.uid);
      const reqFol = target.followRequests.includes(cur.uid);
      const isFri = cur.friends.includes(target.uid);
      const reqFri = target.friendRequests.includes(cur.uid);
      const isBlk = cur.blocked.includes(target.uid);

      return `
        <div class="card card-pad">
          <div class="row" style="gap:16px;margin-bottom:12px;">
            <div style="position:relative;">
              <img src="${uPhoto(target)}" class="avatar" style="width:76px;height:76px;border-color:#FF5A36;" />
              ${isMine ? `<label style="position:absolute;bottom:0;right:0;width:26px;height:26px;border-radius:50%;background:#FF5A36;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;">📷<input type="file" accept="image/*" class="hidden" onchange="changeMyAvatar(this)" /></label>` : ''}
            </div>
            <div style="flex:1;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;">
              <div><b style="font-size:17px;">${myPosts.length}</b><div style="font-size:11px;color:#64748b;">पोस्ट</div></div>
              <button onclick="if(${canSee})openPeopleModal('${target.uid}','followers')"><b style="font-size:17px;">${target.followers.length}</b><div style="font-size:11px;color:#64748b;">फॉलोअर्स</div></button>
              <button onclick="if(${canSee})openPeopleModal('${target.uid}','following')"><b style="font-size:17px;">${target.following.length}</b><div style="font-size:11px;color:#64748b;">फॉलोइंग</div></button>
            </div>
          </div>

          <div style="margin-bottom:12px;">
            <div style="font-size:17px;font-weight:800;">${esc(target.name)} ${target.isPrivate ? '🔒' : ''}</div>
            <div style="font-size:12px;color:#64748b;">@${esc(target.username)} ${!isMine ? `• ${target.isOnline ? 'ऑनलाइन' : timeAgo(target.lastSeen)}` : ''}</div>
            <p style="margin:6px 0 0;font-size:13px;">${esc(target.bio)}</p>
          </div>

          ${isMine ? `
            <div class="row">
              <button onclick="openEditProfileModal()" class="btn btn-soft" style="flex:1;">प्रोफाइल बदलें</button>
              <button onclick="openPeopleModal('${cur.uid}','friends')" class="btn btn-soft">दोस्त (${cur.friends.length})</button>
              <button onclick="openPasswordModal()" class="btn btn-soft" title="पासवर्ड बदलें">⚙️</button>
              <button onclick="logout()" class="btn btn-danger" title="लॉगआउट / अकाउंट बदलें">🚪</button>
            </div>` : `
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
              <button onclick="toggleFollow('${target.uid}')" class="btn ${isFol || reqFol ? 'btn-soft' : 'btn-primary'}">${isFol ? '✓ फॉलो कर रहे हैं' : reqFol ? 'अनुरोध भेजा गया' : (target.isPrivate ? 'फॉलो अनुरोध' : '+ फॉलो करें')}</button>
              <button onclick="openChatWith('${target.uid}')" class="btn btn-dark">💬 संदेश भेजें</button>
            </div>
            <div class="row">
              <button onclick="toggleFriendAction('${target.uid}')" class="btn btn-soft" style="flex:1;font-size:12px;">${isFri ? '✓ मित्र हैं (हटाएँ)' : reqFri ? 'फ्रेंड रिक्वेस्ट रद्द करें' : '👥 फ्रेंड रिक्वेस्ट भेजें'}</button>
              <button onclick="toggleBlockUser('${target.uid}')" class="btn btn-danger" style="font-size:12px;">${isBlk ? 'अनलॉक करें' : '🚫 ब्लॉक'}</button>
            </div>`}
        </div>

        ${isMine && cur.followRequests.length ? `
          <div class="card card-pad">
            <b style="font-size:13px;">फॉलो अनुरोध (${cur.followRequests.length})</b>
            ${cur.followRequests.map(fid => {
              const u = getUser(fid); if (!u) return '';
              return `<div class="between" style="margin-top:8px;">
                <span>${esc(u.name)} (@${esc(u.username)})</span>
                <div class="row"><button onclick="acceptFollowReq('${u.uid}')" class="btn" style="background:#10b981;color:#fff;padding:5px 10px;">स्वीकार</button><button onclick="rejectFollowReq('${u.uid}')" class="btn btn-soft" style="padding:5px 10px;">✕</button></div>
              </div>`;
            }).join('')}
          </div>` : ''}

        <div class="card">
          ${isMine ? `
            <div style="display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border);">
              <button onclick="UI.profileTab='posts';render();" style="padding:11px;font-weight:700;font-size:13px;color:${UI.profileTab === 'posts' ? '#FF5A36' : '#64748b'};border-bottom:${UI.profileTab === 'posts' ? '2px solid #FF5A36' : 'none'};">पोस्ट</button>
              <button onclick="UI.profileTab='saved';render();" style="padding:11px;font-weight:700;font-size:13px;color:${UI.profileTab === 'saved' ? '#FF5A36' : '#64748b'};border-bottom:${UI.profileTab === 'saved' ? '2px solid #FF5A36' : 'none'};">सेव की गईं</button>
            </div>` : ''}
          ${!canSee ? `<div class="card-pad" style="text-align:center;padding:34px;">🔒<div style="font-weight:700;margin-top:6px;">यह अकाउंट प्राइवेट है</div><div style="font-size:12px;color:#64748b;">पोस्ट देखने के लिए फॉलो करें।</div></div>` : `
            <div class="grid-3">
              ${(UI.profileTab === 'saved' && isMine ? cur.savedPosts.map(id => DB.posts.find(p => p.id === id)).filter(Boolean) : myPosts).map(p => {
                const s = resolveMediaSrc(p.mediaUrl);
                return `<div class="grid-cell" onclick="openPostDetailModal('${p.id}')" style="cursor:pointer;">${p.mediaType === 'video' ? `<video src="${s}"></video>` : `<img src="${s}" />`}</div>`;
              }).join('') || '<p style="grid-column:span 3;text-align:center;color:#94a3b8;padding:24px;">अभी कोई पोस्ट नहीं है।</p>'}
            </div>`}
        </div>`;
    }

    // ---------- मुख्य रेंडर ----------
    function render() {
      const app = document.getElementById('app');
      const cur = me();

      if (!cur) {
        document.body.style.paddingBottom = '0';
        app.innerHTML = renderAuthScreen();
        return;
      }

      document.body.style.paddingBottom = '72px';
      const unreadNotifs = DB.notifications.filter(n => n.toUid === cur.uid && !n.isRead).length;
      const unreadChats = DB.chats
        .filter(c => c.participants.includes(cur.uid))
        .reduce((acc, c) => acc + c.messages.filter(m => m.senderId !== cur.uid && !m.isRead).length, 0);

      let bodyHtml = '';
      if (UI.screen === 'home') bodyHtml = renderHome();
      else if (UI.screen === 'search') bodyHtml = renderSearch();
      else if (UI.screen === 'reels') bodyHtml = renderReels();
      else if (UI.screen === 'notifications') bodyHtml = renderNotifications();
      else if (UI.screen === 'chat') bodyHtml = renderChat();
      else if (UI.screen === 'live') bodyHtml = renderLive();
      else if (UI.screen === 'admin') bodyHtml = renderAdmin();
      else if (UI.screen === 'profile') bodyHtml = renderProfile();

      app.innerHTML = `
        ${UI.screen !== 'reels' ? `
          <header class="header">
            <div class="header-inner">
              <button class="logo" onclick="go('home')">
                <div class="logo-badge">Y</div>
                <span class="logo-text">YAARI</span>
              </button>
              <div class="row" style="gap:4px;">
                ${cur.isAdmin ? `<button onclick="go('admin')" class="icon-btn" title="एडमिन पैनल">🛡️</button>` : ''}
                <button onclick="go('live')" class="icon-btn" title="लाइव वीडियो">📡</button>
                <button onclick="go('notifications')" class="icon-btn" title="नोटिफिकेशन">🔔${unreadNotifs ? `<span class="badge">${unreadNotifs}</span>` : ''}</button>
                <button onclick="go('chat')" class="icon-btn" title="निजी चैट">💬${unreadChats ? `<span class="badge" style="background:#FF5A36;">${unreadChats}</span>` : ''}</button>
              </div>
            </div>
          </header>` : ''}

        <main class="container">${bodyHtml}</main>

        <nav class="bottom-nav">
          <div class="bottom-nav-inner">
            <button onclick="go('home')" class="nav-item ${UI.screen === 'home' ? 'active' : ''}">🏠<span>होम</span></button>
            <button onclick="go('search')" class="nav-item ${UI.screen === 'search' ? 'active' : ''}">🔍<span>खोजें</span></button>
            <button onclick="openCreateMenu()" class="nav-item" style="color:#E11D48;">➕<span>बनाएँ</span></button>
            <button onclick="go('reels')" class="nav-item ${UI.screen === 'reels' ? 'active' : ''}">🎬<span>रील्स</span></button>
            <button onclick="go('profile','${cur.uid}')" class="nav-item ${UI.screen === 'profile' ? 'active' : ''}">👤<span>प्रोफाइल</span></button>
          </div>
        </nav>`;
    }

    // तुरंत चालू करें
    render();
    hydrateAllVideos();
  </script>
</body>
</html>
